<main id="checkout-view" class="view-section hidden w-full min-h-screen bg-[#090e13] pt-24 md:pt-32 pb-16 md:pb-24 relative z-20">
  <div class="max-w-4xl mx-auto px-4 md:px-6 pb-16 md:pb-24">
    <button onclick="toggleCart(); switchView('shop');" class="mb-6 md:mb-10 text-[9px] md:text-xs tracking-widest uppercase font-bold hover:opacity-50 transition border border-[#2b3a4a] px-3 py-1.5 md:px-4 md:py-2 rounded-full backdrop-blur flex items-center gap-2 text-white w-max"><i class="fa-solid fa-arrow-left"></i> <span data-tr="pdp_back">BACK</span></button>
    <h2 class="display-font text-4xl md:text-7xl text-white uppercase mb-4 text-center" data-tr="chk_title">Checkout</h2>
    <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-6 md:space-y-8 bg-[#131b23] p-5 md:p-12 border border-[#1e2a36]">
      <div class="space-y-4">
        <h3 class="text-white display-font text-lg md:text-xl uppercase border-b border-[#2b3a4a] pb-2 mb-3 md:mb-4" data-tr="chk_contact">Contact Info</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
          <input type="text" id="chk-name" data-tr="ph_name" required placeholder="Full Name" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
          <input type="email" id="chk-email" data-tr="ph_email" required placeholder="Email Address" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
          <input type="tel" id="chk-phone1" data-tr="ph_phone" required placeholder="Phone (ex: 010...)" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
          <input type="tel" id="chk-phone2" data-tr="ph_whatsapp" placeholder="WhatsApp Number" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
        </div>
      </div>
      <div class="space-y-4 pt-4 md:pt-6">
        <h3 class="text-white display-font text-lg md:text-xl uppercase border-b border-[#2b3a4a] pb-2 mb-3 md:mb-4" data-tr="chk_shipping">Shipping Address</h3>
        <input type="text" id="chk-address" data-tr="ph_address" required placeholder="Detailed Address" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
        <div class="grid grid-cols-3 gap-2 md:gap-4">
          <input type="text" id="chk-building" data-tr="ph_bldg" required placeholder="Bldg No." class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
          <input type="text" id="chk-floor" data-tr="ph_floor" required placeholder="Floor" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
          <input type="text" id="chk-apt" data-tr="ph_apt" required placeholder="Apt" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
        </div>
        <input type="text" id="chk-landmark" data-tr="ph_landmark" placeholder="Special Mark" class="field w-full py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm">
      </div>
      <div class="space-y-4 pt-4 md:pt-6 border-t border-[#1e2a36]">
        <h3 class="text-white display-font text-lg md:text-xl uppercase border-b border-[#2b3a4a] pb-2 mb-3 md:mb-4" data-tr="chk_promo">Promo Code</h3>
        <div class="flex gap-2 md:gap-4">
          <input type="text" id="coupon-code" data-tr="ph_promo" placeholder="ENTER CODE" class="field flex-grow py-2.5 md:py-3 bg-transparent text-white text-xs md:text-sm uppercase tracking-wider">
          <button type="button" onclick="applyCouponCode()" class="bg-white text-black px-4 md:px-6 py-2.5 md:py-3 text-[10px] md:text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition" data-tr="btn_apply">Apply</button>
        </div>
        <p id="coupon-message" class="text-[9px] md:text-xs font-bold uppercase tracking-widest mt-2 hidden"></p>
      </div>
      <div class="space-y-4 pt-4 md:pt-6">
        <h3 class="text-white display-font text-lg md:text-xl uppercase border-b border-[#2b3a4a] pb-2 mb-3 md:mb-4" data-tr="chk_payment">Payment Method</h3>
        <div class="flex flex-col gap-2 md:gap-3">
          <label class="flex items-center gap-3 text-white cursor-pointer p-3 md:p-4 border border-[#2b3a4a] hover:border-[#4fb3d9] transition"><input type="radio" name="payment" value="Cash on Delivery" checked onchange="toggleInstapayUI(false)" class="accent-white"><span class="text-xs md:text-sm tracking-widest uppercase" data-tr="pay_cod">Cash on Delivery</span></label>
          <label class="flex items-center gap-3 text-white cursor-pointer p-3 md:p-4 border border-[#2b3a4a] hover:border-[#4fb3d9] transition"><input type="radio" name="payment" value="Instapay" onchange="toggleInstapayUI(true)" class="accent-white"><span class="text-xs md:text-sm tracking-widest uppercase" data-tr="pay_insta">InstaPay</span></label>
        </div>
        <div id="instapay-block" class="hidden mt-4 bg-[#131b23] border border-[#2b3a4a] p-4 md:p-6">
          <p class="text-[#8ea4be] text-[10px] tracking-widest uppercase mb-2" data-tr="insta_step1">1. Transfer the total amount to:</p>
          <p class="text-white font-bold text-lg md:text-xl mb-6">01220543105</p>
          <p class="text-[#8ea4be] text-[10px] tracking-widest uppercase mb-2" data-tr="insta_step2">2. Upload Payment Screenshot</p>
          <input type="file" id="instapay-receipt" accept="image/*" class="w-full bg-[#0e141a] border border-[#1e2a36] text-white p-3 text-xs outline-none">
        </div>
      </div>
      <button type="submit" class="w-full bg-white text-black py-4 md:py-6 text-[10px] md:text-sm tracking-widest font-bold uppercase hover:bg-gray-300 transition mt-6 md:mt-8" data-tr="chk_btn">Confirm & Place Order</button>
    </form>
  </div>
</main>
