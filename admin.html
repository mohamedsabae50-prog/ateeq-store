<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateeq Admin | لوحة التحكم</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Space+Grotesk:wght@400;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    background-color: #030303;
    color: #f5f5f5;
    font-family: 'Space Grotesk', sans-serif;
  }
  .brand-ar { font-family: 'Aref Ruqaa', serif; }
  .display-font { font-family: 'Syncopate', sans-serif; letter-spacing: -1px; }
  
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #030303; }
  ::-webkit-scrollbar-thumb { background: #333; }

  .admin-input {
    background: #0a0a0a; border: 1px solid #333; color: white;
    padding: 12px 16px; outline: none; transition: border 0.3s;
    width: 100%; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .admin-input:focus { border-color: white; }
  
  input[type="file"]::file-selector-button {
    background: #fff;
    color: #000;
    border: none;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 10px;
    text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
  }
</style>
</head>
<body class="flex h-screen overflow-hidden relative">

  <aside class="w-64 bg-[#0a0a0a] border-r border-[#222] flex flex-col justify-between h-full z-10 relative">
    <div>
      <div class="p-8 border-b border-[#222] text-center">
        <h1 class="brand-ar text-4xl text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.2)]">عـتـيـق</h1>
        <p class="text-[10px] tracking-widest uppercase text-gray-500 mt-2">Admin Portal</p>
      </div>
      <nav class="p-6 space-y-2">
        <button onclick="switchAdminView('dashboard')" id="btn-dashboard" class="admin-tab w-full flex items-center gap-4 px-4 py-3 text-xs tracking-widest uppercase font-bold text-black bg-white transition rounded-sm">
          <i class="fa-solid fa-chart-line text-lg"></i> Dashboard
        </button>
        <button onclick="switchAdminView('orders')" id="btn-orders" class="admin-tab w-full flex items-center gap-4 px-4 py-3 text-xs tracking-widest uppercase font-bold text-gray-400 hover:text-white transition rounded-sm">
          <i class="fa-solid fa-box-open text-lg"></i> Orders
        </button>
        <button onclick="switchAdminView('products')" id="btn-products" class="admin-tab w-full flex items-center gap-4 px-4 py-3 text-xs tracking-widest uppercase font-bold text-gray-400 hover:text-white transition rounded-sm">
          <i class="fa-solid fa-tags text-lg"></i> Products
        </button>
      </nav>
    </div>
    <div class="p-6 border-t border-[#222]">
      <button class="w-full flex items-center justify-center gap-3 border border-[#333] hover:border-red-500 hover:text-red-500 text-gray-400 py-3 text-xs tracking-widest uppercase transition">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
      </button>
    </div>
  </aside>

  <main class="flex-1 h-full overflow-y-auto p-10 relative bg-[#030303]">
    
    <div id="view-dashboard" class="admin-section block">
      <h2 class="display-font text-3xl uppercase mb-8">Overview</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
        <div class="bg-[#0a0a0a] border border-[#222] p-6">
          <p class="text-[10px] tracking-widest uppercase text-gray-500 mb-2">Total Revenue</p>
          <h3 class="text-3xl font-bold text-white" id="dash-revenue">0 EGP</h3>
        </div>
        <div class="bg-[#0a0a0a] border border-[#222] p-6">
          <p class="text-[10px] tracking-widest uppercase text-gray-500 mb-2">Total Orders</p>
          <h3 class="text-3xl font-bold text-white" id="dash-orders">0</h3>
        </div>
        <div class="bg-[#0a0a0a] border border-[#222] p-6">
          <p class="text-[10px] tracking-widest uppercase text-gray-500 mb-2">Products in Store</p>
          <h3 class="text-3xl font-bold text-white" id="dash-products">0</h3>
        </div>
      </div>
    </div>

    <div id="view-orders" class="admin-section hidden">
      <div class="flex justify-between items-center mb-8">
        <h2 class="display-font text-3xl uppercase">Manage Orders</h2>
      </div>
      <div class="bg-[#0a0a0a] border border-[#222] overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#222] bg-[#111]">
            <tr>
              <th class="p-4">Serial</th>
              <th class="p-4">Date</th>
              <th class="p-4">Amount</th>
              <th class="p-4">Payment</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="text-xs font-bold tracking-wider">
            <tr><td colspan="5" class="p-8 text-center text-gray-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="view-products" class="admin-section hidden">
      <div class="flex justify-between items-center mb-8">
        <h2 class="display-font text-3xl uppercase">Store Inventory</h2>
        <button onclick="toggleProductModal()" class="bg-white text-black px-6 py-3 text-xs font-bold tracking-widest uppercase hover:bg-gray-300 transition flex items-center gap-2 shadow-[0_0_15px_rgba(255,255,255,0.2)]">
          <i class="fa-solid fa-plus"></i> Add Product
        </button>
      </div>
      <div class="bg-[#0a0a0a] border border-[#222] overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-[10px] uppercase tracking-widest text-gray-500 border-b border-[#222] bg-[#111]">
            <tr>
              <th class="p-4 w-16">Img</th>
              <th class="p-4">Product Name</th>
              <th class="p-4">Category</th>
              <th class="p-4">Price</th>
              <th class="p-4">Stock</th>
              <th class="p-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="products-table-body" class="text-xs font-bold tracking-wider text-gray-400">
             <tr><td colspan="6" class="p-8 text-center text-gray-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="product-modal" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0 duration-300">
      <div class="bg-[#050505] border border-[#333] w-full max-w-2xl p-8 relative shadow-2xl overflow-y-auto max-h-[90vh]">
          <button onclick="toggleProductModal()" class="absolute top-6 right-6 text-white text-xl hover:text-gray-400 transition"><i class="fa-solid fa-xmark"></i></button>
          <h2 class="display-font text-3xl text-white uppercase mb-8 border-b border-[#222] pb-4">New Product</h2>
          
          <form id="addProductForm" onsubmit="handleAddProduct(event)" class="space-y-5">
              <div>
                  <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Product Name</label>
                  <input type="text" id="prod-name" required placeholder="e.g. Midnight Black Hoodie" class="admin-input">
              </div>
              
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                      <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Category</label>
                      <select id="prod-category" class="admin-input cursor-pointer">
                          <option value="Hoodies">Hoodies</option>
                          <option value="Graphic Tees">Graphic Tees</option>
                          <option value="Accessories">Accessories</option>
                      </select>
                  </div>
                  <div>
                      <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Price (EGP)</label>
                      <input type="number" id="prod-price" required placeholder="800" class="admin-input">
                  </div>
                  <div>
                      <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Stock Status</label>
                      <select id="prod-stock" class="admin-input cursor-pointer">
                          <option value="In Stock">In Stock</option>
                          <option value="Out of Stock">Out of Stock</option>
                      </select>
                  </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-[#222] pt-6 mt-4">
                  <div>
                      <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Main Image (Front)</label>
                      <input type="file" id="prod-image-main" accept="image/png, image/jpeg, image/webp" required class="admin-input cursor-pointer">
                  </div>
                  <div>
                      <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Hover Image (Back/Model)</label>
                      <input type="file" id="prod-image-hover" accept="image/png, image/jpeg, image/webp" required class="admin-input cursor-pointer">
                  </div>
              </div>

              <div class="border-t border-[#222] pt-4 mt-2">
                  <label class="text-gray-500 text-[10px] tracking-widest uppercase block mb-2">Extra Gallery Images</label>
                  <input type="file" id="prod-image-gallery" accept="image/png, image/jpeg, image/webp" multiple class="admin-input cursor-pointer">
              </div>

              <button type="submit" class="w-full bg-white text-black py-4 text-xs tracking-widest font-bold uppercase hover:bg-gray-300 transition mt-8 flex items-center justify-center gap-2">
                  Save Product
              </button>
          </form>
      </div>
  </div>

  <div id="order-details-modal" class="fixed inset-0 bg-black/90 z-[150] hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity opacity-0 duration-300">
      <div class="bg-[#050505] border border-[#333] w-full max-w-lg p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
          <button onclick="closeOrderModal()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition">
              <i class="fa-solid fa-xmark text-xl"></i>
          </button>
          
          <h2 class="text-white text-xl display-font uppercase tracking-widest mb-6 border-b border-[#222] pb-4">Order Details</h2>
          
          <div id="modal-order-content" class="text-gray-300 space-y-4 mb-8 text-sm">
              </div>
          
          <div class="flex gap-4 items-end border-t border-[#222] pt-6">
              <div class="flex-1">
                  <label class="text-gray-500 text-[10px] uppercase tracking-widest block mb-2">Update Status</label>
                  <select id="new-status" class="admin-input cursor-pointer">
                      <option value="Pending">Pending</option>
                      <option value="Processing">Processing</option>
                      <option value="Shipped">Shipped</option>
                      <option value="Delivered">Delivered</option>
                      <option value="Cancelled">Cancelled</option>
                  </select>
              </div>
              <button onclick="saveOrderStatus(event)" class="bg-white text-black px-6 py-3 text-xs font-bold uppercase tracking-widest hover:bg-gray-200 transition">
                  Save Changes
              </button>
          </div>
      </div>
  </div>
  <script>
  const ADMIN_SUPA_URL = 'https://kkbejeioqltbllshhlcp.supabase.co';
  const ADMIN_SUPA_KEY = 'sb_publishable_F8LXj9xjlkJKv4VQJDzoxQ_P3io41th';
  
  let adminClient;
  let allOrders = []; // مصفوفة لحفظ كل الطلبات

  try {
      if (window.supabase) {
          adminClient = window.supabase.createClient(ADMIN_SUPA_URL, ADMIN_SUPA_KEY);
      }
  } catch (e) {
      console.error("Supabase Init Error:", e);
  }

  function switchAdminView(viewName) {
    try {
        document.querySelectorAll('.admin-section').forEach(el => {
          el.classList.add('hidden'); el.classList.remove('block');
        });
        document.querySelectorAll('.admin-tab').forEach(el => {
          el.classList.remove('text-black', 'bg-white');
          el.classList.add('text-gray-400', 'bg-transparent');
        });

        document.getElementById('view-' + viewName).classList.remove('hidden');
        document.getElementById('view-' + viewName).classList.add('block');
        
        const activeTab = document.getElementById('btn-' + viewName);
        activeTab.classList.remove('text-gray-400', 'bg-transparent');
        activeTab.classList.add('text-black', 'bg-white');

        if(viewName === 'orders') fetchOrders();
        if(viewName === 'products') fetchProducts();
        if(viewName === 'dashboard') fetchDashboardData();
    } catch(error) { console.error("UI Switch Error:", error); }
  }

  function toggleProductModal() {
      const modal = document.getElementById('product-modal');
      if (modal.classList.contains('hidden')) {
          modal.classList.remove('hidden'); modal.classList.add('flex');
          setTimeout(() => modal.classList.remove('opacity-0'), 10);
      } else {
          modal.classList.add('opacity-0');
          setTimeout(() => {
              modal.classList.add('hidden'); modal.classList.remove('flex');
              document.getElementById('addProductForm').reset();
          }, 300);
      }
  }

  let currentOrderId = null;

  window.openOrderModal = function(id) {
      currentOrderId = id;
      const order = allOrders.find(o => o.id === id);
      if (!order) return;

      const date = new Date(order.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const customerName = order.full_name || order.name || 'N/A';
      const phone = order.phone || 'N/A';
      const address = order.address || 'N/A';

      let itemsHtml = '';
      if (order.items && Array.isArray(order.items)) {
          itemsHtml = order.items.map(item => `
              <div class="flex justify-between items-center text-xs mt-2 bg-[#111] p-3 border border-[#222]">
                  <span class="text-gray-300">- ${item.title || item.name} <b class="text-white ml-1">(Size: ${item.size || 'N/A'})</b></span>
                  <span class="text-white font-bold">${item.price} EGP</span>
              </div>
          `).join('');
      } else {
          itemsHtml = '<div class="text-gray-600 text-xs mt-1">No items recorded</div>';
      }

      const content = document.getElementById('modal-order-content');
      content.innerHTML = `
          <div class="flex justify-between items-center border-b border-[#222] pb-2">
              <span class="text-gray-500 text-[10px] uppercase tracking-widest">Serial</span>
              <span class="text-white font-bold">${order.serial_number}</span>
          </div>
          
          <div class="border-b border-[#222] py-3 space-y-2 bg-[#0a0a0a] p-3 mt-2">
              <div class="text-gray-500 text-[10px] uppercase tracking-widest mb-2 border-b border-[#222] pb-1">Customer Info</div>
              <div class="flex justify-between items-center">
                  <span class="text-gray-400 text-xs">Name:</span>
                  <span class="text-white text-xs">${customerName}</span>
              </div>
              <div class="flex justify-between items-center">
                  <span class="text-gray-400 text-xs">Phone:</span>
                  <span class="text-white text-xs">${phone}</span>
              </div>
              <div class="flex flex-col gap-1 mt-1">
                  <span class="text-gray-400 text-xs">Address:</span>
                  <span class="text-white text-xs leading-relaxed">${address}</span>
              </div>
          </div>

          <div class="border-b border-[#222] py-3">
              <div class="text-gray-500 text-[10px] uppercase tracking-widest mb-2">Order Items</div>
              ${itemsHtml}
          </div>

          <div class="flex justify-between items-center border-b border-[#222] pb-2 pt-3">
              <span class="text-gray-500 text-[10px] uppercase tracking-widest">Payment</span>
              <span class="text-white">${order.payment_method}</span>
          </div>
          <div class="flex justify-between items-center border-b border-[#222] pb-2 pt-2">
              <span class="text-gray-500 text-[10px] uppercase tracking-widest">Total Amount</span>
              <span class="text-white font-bold text-lg">${order.total_amount} EGP</span>
          </div>
          <div class="flex justify-between items-center pt-2">
              <span class="text-gray-500 text-[10px] uppercase tracking-widest">Status</span>
              <span class="text-yellow-500 font-bold">${order.status}</span>
          </div>
      `;
      
      document.getElementById('new-status').value = order.status;
      
      const modal = document.getElementById('order-details-modal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
  };

  window.closeOrderModal = function() {
      const modal = document.getElementById('order-details-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => {
          modal.classList.add('hidden'); modal.classList.remove('flex');
          currentOrderId = null;
      }, 300);
  };

  window.saveOrderStatus = async function(event) {
      if (!currentOrderId || !adminClient) return;
      const newStatus = document.getElementById('new-status').value;
      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>...'; btn.disabled = true;
      
      try {
          const { error } = await adminClient.from('orders').update({ status: newStatus }).eq('id', currentOrderId);
          if (error) throw error;
          closeOrderModal(); fetchOrders();
      } catch (error) { alert('Failed to update status.'); } 
      finally { btn.innerHTML = originalText; btn.disabled = false; }
  };

  async function fetchDashboardData() {
      if (!adminClient) return;
      try {
          const { data: orders } = await adminClient.from('orders').select('total_amount');
          if (orders) {
              document.getElementById('dash-orders').textContent = orders.length;
              const totalRev = orders.reduce((sum, order) => sum + (order.total_amount || 0), 0);
              document.getElementById('dash-revenue').textContent = totalRev.toLocaleString() + ' EGP';
          }
          const { data: products } = await adminClient.from('products').select('id');
          if (products) document.getElementById('dash-products').textContent = products.length;
      } catch (error) {}
  }

  async function fetchOrders() {
      if (!adminClient) return;
      const tbody = document.getElementById('orders-table-body');
      try {
          const { data: orders, error } = await adminClient.from('orders').select('*').order('created_at', { ascending: false });
          if (error) throw error;
          
          allOrders = orders; // حفظ الطلبات
          
          if (orders.length === 0) {
              tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">No orders found.</td></tr>';
              return;
          }

          tbody.innerHTML = orders.map(order => {
              const date = new Date(order.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
              let statusClass = order.status === 'Pending' ? 'text-yellow-500' : order.status === 'Cancelled' ? 'text-red-500' : 'text-green-500';
              
              return `
              <tr class="border-b border-[#222] hover:bg-[#111] transition cursor-pointer" onclick="openOrderModal('${order.id}')">
                  <td class="p-4 text-white">${order.serial_number}</td>
                  <td class="p-4 text-gray-400">${date}</td>
                  <td class="p-4 text-white">${order.total_amount} EGP</td>
                  <td class="p-4 text-gray-400">${order.payment_method}</td>
                  <td class="p-4 ${statusClass} font-bold">${order.status}</td>
              </tr>`;
          }).join('');
      } catch (error) { tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-500">Error loading orders.</td></tr>'; }
  }

  async function fetchProducts() {
      if (!adminClient) return;
      const tbody = document.getElementById('products-table-body');
      try {
          const { data: products, error } = await adminClient.from('products').select('*').order('id', { ascending: false });
          if (error) throw error;
          
          if (products.length === 0) {
              tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">No products added.</td></tr>'; return;
          }

          tbody.innerHTML = products.map(product => {
              let stockClass = product.stock_status === 'In Stock' ? 'text-green-500' : 'text-red-500';
              return `
              <tr class="border-b border-[#222] hover:bg-[#111] transition">
                  <td class="p-4"><img src="${product.image_url}" class="w-10 h-10 object-cover border border-[#333] grayscale"></td>
                  <td class="p-4 text-white uppercase">${product.name}</td>
                  <td class="p-4">${product.category}</td>
                  <td class="p-4 text-white">${product.price} EGP</td>
                  <td class="p-4 ${stockClass}">${product.stock_status}</td>
                  <td class="p-4 text-right flex justify-end gap-4 mt-2">
                      <button onclick="deleteProduct(${product.id})" class="hover:text-red-500 transition"><i class="fa-solid fa-trash"></i></button>
                  </td>
              </tr>`;
          }).join('');
      } catch (error) { tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-red-500">Error loading products.</td></tr>'; }
  }

  async function handleAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('prod-name').value;
      const category = document.getElementById('prod-category').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const stock = document.getElementById('prod-stock').value;
      const mainFile = document.getElementById('prod-image-main').files[0];
      const hoverFile = document.getElementById('prod-image-hover').files[0];
      
      if (!mainFile || !hoverFile) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>...'; submitBtn.disabled = true;

      try {
          async function uploadImage(file) {
              const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
              const { error } = await adminClient.storage.from('product-images').upload(`public/${fileName}`, file);
              if (error) throw error;
              return adminClient.storage.from('product-images').getPublicUrl(`public/${fileName}`).data.publicUrl;
          }

          const [mainImageUrl, hoverImageUrl] = await Promise.all([uploadImage(mainFile), uploadImage(hoverFile)]);

          const { error: dbError } = await adminClient.from('products').insert([{ 
              name: name, category: category, price: price, stock_status: stock, image_url: mainImageUrl, hover_image_url: hoverImageUrl
          }]);
          if (dbError) throw dbError;
          
          toggleProductModal(); fetchProducts(); fetchDashboardData();
          document.getElementById('addProductForm').reset(); 
      } catch (error) { alert("Failed to add product."); } 
      finally { submitBtn.innerHTML = 'Save Product'; submitBtn.disabled = false; }
  }

  async function deleteProduct(id) {
      if(confirm("Are you sure?")) {
          await adminClient.from('products').delete().eq('id', id);
          fetchProducts(); fetchDashboardData();
      }
  }

  document.addEventListener('DOMContentLoaded', () => { fetchDashboardData(); });
</script>
</body>
</html>
