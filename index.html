<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عـتـيـق | ATEEQ</title>
<link rel="icon" type="image/png" href="media/logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Oswald:wght@700&family=Permanent+Marker&family=Cinzel:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Space+Grotesk:wght@400;600;700&family=Syncopate:wght@700&display=block" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  #pdp-gallery img { width: 80px !important; flex-shrink: 0; }
  @media (min-width: 1024px) { #pdp-gallery img { width: 100% !important; } }
</style>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
  (function(){ emailjs.init("knN6m8jjCj28sjTL5"); })();
</script>
</head>
<body>
  <div id="header-container"></div>
  <div id="home-container"></div>
  <div id="about-container"></div>
  <div id="shop-container"></div>
  <div id="pdp-container"></div>
  <div id="studio-container"></div>
  <div id="checkout-container"></div>
  <div id="profile-container"></div>
  <div id="footer-container"></div>

  <script src="partials/translations.js"></script>
  <script>
    (async function(){
      const partials = {
        'header-container': 'partials/header.html',
        'home-container': 'partials/home.html',
        'about-container': 'partials/about.html',
        'shop-container': 'partials/shop.html',
        'pdp-container': 'partials/pdp.html',
        'studio-container': 'partials/studio.html',
        'checkout-container': 'partials/checkout.html',
        'profile-container': 'partials/profile.html',
        'footer-container': 'partials/footer.html'
      };
      for (const [id, file] of Object.entries(partials)) {
        const response = await fetch(file);
        if (!response.ok) throw new Error('Failed to load ' + file);
        document.getElementById(id).innerHTML = await response.text();
      }
      const script = document.createElement('script');
      script.type = 'module';
      script.src = 'main.js';
      document.body.appendChild(script);
      window.__partialsLoaded = true;

      setTimeout(() => {
        const loaders = document.querySelectorAll('[id*="loader"], [class*="loader"], [id*="splash"], [class*="splash"], [id*="pre"], [class*="pre"]');
        loaders.forEach(loader => {
          loader.style.transition = 'opacity 0.5s ease';
          loader.style.opacity = '0';
          setTimeout(() => loader.style.display = 'none', 500);
        });
        document.body.style.overflow = 'auto';
      }, 800);

    })().catch(error => console.error(error));
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    window.toggleMusic = function() {
      const music = document.getElementById('bg-music');
      const icon = document.getElementById('music-icon');
      if (!music) return;
      
      if (music.paused) {
        music.play().catch(err => console.log("Audio error:", err));
        if (icon) {
          icon.classList.remove('fa-volume-xmark');
          icon.classList.add('fa-volume-high');
        }
      } else {
        music.pause();
        if (icon) {
          icon.classList.remove('fa-volume-high');
          icon.classList.add('fa-volume-xmark');
        }
      }
    };
  </script>
</body>
</html>
